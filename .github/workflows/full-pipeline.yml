name: Full YouTube Shorts Pipeline

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of videos to produce"
        type: number
        default: 3
        required: false
      model:
        description: "LLM model key for script generation"
        type: string
        default: "gemini-35-flash-lite"
        required: false
      rank_model:
        description: "LLM model key for editorial rerank (separate rate limits)"
        type: string
        default: "nvidia-nemotron-ultra"
        required: false
      no_video:
        description: "Scripts only (skip voice, assets, render, upload)"
        type: boolean
        default: false
        required: false

jobs:
  pipeline:
    name: Generate Shorts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write  # for git commit/push at end of pipeline

    steps:
      # ──────────────────────────────────────────────────────────────────────
      # Checkout & Setup
      # ──────────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git push at end

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # ──────────────────────────────────────────────────────────────────────
      # System Dependencies
      # ──────────────────────────────────────────────────────────────────────
      - name: Install system packages
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsm6 libxext6 libxrender-dev libglib2.0-0

      # ──────────────────────────────────────────────────────────────────────
      # Python Dependencies
      # ──────────────────────────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r requirements.txt
          # WhisperX for word-level timestamps (install from GitHub, not PyPI)
          python3 -m pip install --break-system-packages git+https://github.com/m-bain/whisperx.git
          python3 -m pip install --break-system-packages torch --index-url https://download.pytorch.org/whl/cpu

      # ──────────────────────────────────────────────────────────────────────
      # Node Dependencies (Remotion)
      # ──────────────────────────────────────────────────────────────────────
      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      # ──────────────────────────────────────────────────────────────────────
      # Run Pipeline
      # ──────────────────────────────────────────────────────────────────────
      - name: Run full pipeline (with video rendering)
        if: github.event.inputs.no_video != 'true'
        id: pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python3 run_pipeline.py \
            --auto \
            --count ${{ github.event.inputs.count }} \
            --model ${{ github.event.inputs.model }} \
            --rank-model ${{ github.event.inputs.rank_model }} \
            --render

      - name: Run full pipeline (scripts only, no video)
        if: github.event.inputs.no_video == 'true'
        id: pipeline-no-video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python3 run_pipeline.py \
            --auto \
            --count ${{ github.event.inputs.count }} \
            --model ${{ github.event.inputs.model }} \
            --rank-model ${{ github.event.inputs.rank_model }} \
            --no-video

      # ──────────────────────────────────────────────────────────────────────
      # Upload Videos as Artifacts
      # ──────────────────────────────────────────────────────────────────────
      - name: Upload generated videos
        if: github.event.inputs.no_video != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-videos-${{ github.run_id }}
          path: output/**/draft_video.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: Upload project folders (scripts, metadata, assets)
        uses: actions/upload-artifact@v4
        with:
          name: shorts-projects-${{ github.run_id }}
          path: output/**/*
          retention-days: 7

      # ──────────────────────────────────────────────────────────────────────
      # YouTube Upload
      # ──────────────────────────────────────────────────────────────────────
      - name: Upload to YouTube
        if: github.event.inputs.no_video != 'true'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== YouTube Upload Debug ==="
          echo "YOUTUBE_TOKEN set: ${YOUTUBE_TOKEN:+yes}"
          echo "Looking for videos in output/**/draft_video.mp4"
          shopt -s nullglob globstar
          videos=(output/**/draft_video.mp4)
          echo "Found ${#videos[@]} video(s)"
          for video in "${videos[@]}"; do
            echo "  Video: $video"
            meta="${video%/*}/youtube_meta.json"
            echo "  Metadata: $meta"
            if [[ -f "$meta" ]]; then
              echo "  Uploading..."
              python3 youtube_upload.py "$video" "$meta"
            else
              echo "  WARNING: No metadata file, skipping"
              cat "${video%/*}/metadata.txt" 2>/dev/null || echo "  (no metadata.txt either)"
            fi
          done
          if [[ ${#videos[@]} -eq 0 ]]; then
            echo "ERROR: No draft_video.mp4 files found!"
            echo "Contents of output/:"
            find output -type f -name "*.mp4" 2>/dev/null | head -20
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────────
      # Summary
      # ──────────────────────────────────────────────────────────────────────
      - name: Print summary
        run: |
          echo "## Pipeline Complete"
          echo ""
          echo "Run: ${{ github.run_id }}"
          echo "Videos requested: ${{ github.event.inputs.count }}"
          echo "Model: ${{ github.event.inputs.model }}"
          echo "Rank model: ${{ github.event.inputs.rank_model }}"
          echo "No-video mode: ${{ github.event.inputs.no_video }}"
          echo ""
          if [[ "${{ github.event.inputs.no_video }}" != "true" ]]; then
            echo "### Generated videos:"
            find output -name "draft_video.mp4" -exec ls -lh {} \;
          fi