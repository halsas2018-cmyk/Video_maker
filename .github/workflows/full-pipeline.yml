      # System dependencies
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsm6 \
            libxext6 \
            libxrender-dev \
            libglib2.0-0

      # Download Piper TTS models
      - name: Download Piper TTS models
        run: |
          mkdir -p models/piper

          # Array of model files to download: voice_name, url_suffix
          declare -a models=(
            "en_US-ryan-medium en/en_US/ryan/medium/en_US-ryan-medium"
            "en_US-amy-medium en/en_US/amy/medium/en_US-amy-medium"
            "en_US-hfc_male-medium en/en_US/hfc_male/medium/en_US-hfc_male-medium"
          )

          for model_spec in "${models[@]}"; do
            voice_name=$(echo "$model_spec" | cut -d' ' -f1)
            url_suffix=$(echo "$model_spec" | cut -d' ' -f2)

            echo "Downloading model: $voice_name"

            # Download .onnx file
            onnx_url="https://huggingface.co/rhasspy/piper-voices/resolve/main/$url_suffix.onnx?download=true"
            onnx_temp=$(mktemp)
            if ! curl -fL "$onnx_url" -o "$onnx_temp"; then
              echo "Failed to download ONNX model for $voice_name"
              rm -f "$onnx_temp"
              exit 1
            fi
            if [ ! -s "$onnx_temp" ]; then
              echo "Downloaded ONNX file is empty for $voice_name"
              rm -f "$onnx_temp"
              exit 1
            fi
            mv "$onnx_temp" "models/piper/${voice_name}.onnx"

            # Download .json config file
            json_url="https://huggingface.co/rhasspy/piper-voices/resolve/main/$url_suffix.onnx.json?download=true"
            json_temp=$(mktemp)
            if ! curl -fL "$json_url" -o "$json_temp"; then
              echo "Failed to download JSON config for $voice_name"
              rm -f "$json_temp"
              exit 1
            fi
            if [ ! -s "$json_temp" ]; then
              echo "Downloaded JSON file is empty for $voice_name"
              rm -f "$json_temp"
              exit 1
            fi
            mv "$json_temp" "models/piper/${voice_name}.onnx.json"

            echo "Successfully downloaded $voice_name"
          done

          # Verify all files exist
          expected_files=(
            "models/piper/en_US-ryan-medium.onnx"
            "models/piper/en_US-ryan-medium.onnx.json"
            "models/piper/en_US-amy-medium.onnx"
            "models/piper/en_US-amy-medium.onnx.json"
            "models/piper/en_US-hfc_male-medium.onnx"
            "models/piper/en_US-hfc_male-medium.onnx.json"
          )

          for file in "${expected_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Expected file not found: $file"
              exit 1
            fi
            if [ ! -s "$file" ]; then
              echo "Expected file is empty: $file"
              exit 1
            fi
          done

          echo "All Piper TTS models downloaded successfully"

      # Python dependencies
      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r requirements.txt
          python3 -m pip install --break-system-packages \
            git+https://github.com/m-bain/whisperx.git
          python3 -m pip install --break-system-packages \
            torch --index-url https://download.pytorch.org/whl/cpu