name: Full YouTube Shorts Pipeline

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of videos to produce"
        type: number
        default: 3
        required: false
      model:
        description: "LLM model key for script generation"
        type: string
        default: "gemini-35-flash-lite"
        required: false
      rank_model:
        description: "LLM model key for editorial rerank (defaults to model)"
        type: string
        default: "nvidia-nemotron-ultra"
        required: false
      no_video:
        description: "Scripts only (skip voice, assets, render, upload)"
        type: boolean
        default: false
        required: false

jobs:
  pipeline:
    name: Generate Shorts
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # ── 3. Node.js (for Remotion render) ─────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # ── 4. System packages (ffmpeg required by voice_generator + remotion_assembler) ──
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsm6 \
            libxext6 \
            libxrender-dev \
            libglib2.0-0 \
            curl

      # ── 5. Piper TTS models (all 3 voices used by voice_generator.py) ────────
      - name: Download Piper TTS models
        run: |
          mkdir -p models/piper

          declare -A model_paths=(
            ["en_US-ryan-medium"]="en/en_US/ryan/medium/en_US-ryan-medium"
            ["en_US-amy-medium"]="en/en_US/amy/medium/en_US-amy-medium"
            ["en_US-hfc_male-medium"]="en/en_US/hfc_male/medium/en_US-hfc_male-medium"
          )

          for voice_name in "${!model_paths[@]}"; do
            url_suffix="${model_paths[$voice_name]}"
            echo "━━ Downloading: $voice_name"

            # .onnx model
            onnx_tmp=$(mktemp)
            curl -fsSL "https://huggingface.co/rhasspy/piper-voices/resolve/main/${url_suffix}.onnx?download=true" \
              -o "$onnx_tmp" || { echo "ERROR: failed to download ${voice_name}.onnx"; exit 1; }
            [ -s "$onnx_tmp" ] || { echo "ERROR: empty file for ${voice_name}.onnx"; exit 1; }
            mv "$onnx_tmp" "models/piper/${voice_name}.onnx"

            # .onnx.json config
            json_tmp=$(mktemp)
            curl -fsSL "https://huggingface.co/rhasspy/piper-voices/resolve/main/${url_suffix}.onnx.json?download=true" \
              -o "$json_tmp" || { echo "ERROR: failed to download ${voice_name}.onnx.json"; exit 1; }
            [ -s "$json_tmp" ] || { echo "ERROR: empty file for ${voice_name}.onnx.json"; exit 1; }
            mv "$json_tmp" "models/piper/${voice_name}.onnx.json"

            echo "✓ $voice_name"
          done

          echo "✓ All Piper TTS models downloaded"
          ls -lh models/piper/

      # ── 6. Python dependencies ────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r requirements.txt
          # WhisperX for word-level timestamps (word captions in Remotion)
          python3 -m pip install --break-system-packages \
            git+https://github.com/m-bain/whisperx.git
          # CPU-only torch (CI has no GPU)
          python3 -m pip install --break-system-packages \
            torch --index-url https://download.pytorch.org/whl/cpu

      # ── 7. Node / Remotion dependencies ──────────────────────────────────────
      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      # ── 8. Run full pipeline (voice + assets + Remotion render) ──────────────
      - name: Run full pipeline
        if: ${{ github.event.inputs.no_video != 'true' }}
        id: pipeline
        env:
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY:  ${{ secrets.NVIDIA_API_KEY }}
          PEXELS_API_KEY:  ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python3 run_pipeline.py \
            --auto \
            --count "${{ inputs.count }}" \
            --model "${{ inputs.model }}" \
            --rank-model "${{ inputs.rank_model }}" \
            --render

      # ── 8b. Scripts-only mode ─────────────────────────────────────────────────
      - name: Run pipeline (scripts only)
        if: ${{ github.event.inputs.no_video == 'true' }}
        id: pipeline-no-video
        env:
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY:  ${{ secrets.NVIDIA_API_KEY }}
          PEXELS_API_KEY:  ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python3 run_pipeline.py \
            --auto \
            --count "${{ inputs.count }}" \
            --model "${{ inputs.model }}" \
            --rank-model "${{ inputs.rank_model }}" \
            --no-video

      # ── 9. Diagnostics (always, even on failure) ──────────────────────────────
      - name: Diagnose generated files
        if: always() && github.event.inputs.no_video != 'true'
        run: |
          echo "=== Rendered videos ==="
          find output -type f -name 'draft_video.mp4' 2>/dev/null | sort || echo "(none)"

          echo ""
          echo "=== YouTube metadata ==="
          find output -type f -name 'youtube_meta.json' 2>/dev/null | sort || echo "(none)"

          echo ""
          echo "=== Output directory size ==="
          du -sh output 2>/dev/null || echo "output/ does not exist"

          echo ""
          echo "=== MP4 files (first 20) ==="
          find output -type f -name '*.mp4' 2>/dev/null | head -20 || echo "(none)"

      # ── 10. Save videos as GitHub artifacts ───────────────────────────────────
      - name: Upload rendered videos (artifacts)
        if: always() && github.event.inputs.no_video != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-videos-${{ github.run_id }}
          path: output/**/draft_video.mp4
          retention-days: 7
          if-no-files-found: warn

      # ── 11. Save all project files as artifacts ───────────────────────────────
      - name: Upload project folders (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-projects-${{ github.run_id }}
          path: output/**/*
          retention-days: 7
          if-no-files-found: warn

      # ── 12. YouTube upload ────────────────────────────────────────────────────
      # Requires YOUTUBE_TOKEN secret: a JSON blob from token.json produced by
      # youtube_auth_headless.py (OAuth refresh token must be included).
      - name: Upload to YouTube
        if: always() && github.event.inputs.no_video != 'true'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          set -uo pipefail

          echo "=== YouTube Upload ==="

          # Guard: token must be set
          if [[ -z "${YOUTUBE_TOKEN:-}" ]]; then
            echo "ERROR: YOUTUBE_TOKEN secret is missing or empty."
            echo "Generate it locally with: python3 youtube_auth_headless.py"
            exit 1
          fi

          # Guard: upload script must exist
          if [[ ! -f youtube_upload.py ]]; then
            echo "ERROR: youtube_upload.py not found in repo root."
            exit 1
          fi

          # Guard: output dir must exist
          if [[ ! -d output ]]; then
            echo "ERROR: output/ directory does not exist — pipeline likely produced nothing."
            exit 1
          fi

          # Collect all rendered videos (sorted for deterministic order)
          mapfile -d '' -t videos < <(
            find output -type f -name 'draft_video.mp4' -print0 | sort -z
          )

          echo "Videos found: ${#videos[@]}"

          if [[ ${#videos[@]} -eq 0 ]]; then
            echo "ERROR: No draft_video.mp4 files found — nothing to upload."
            exit 1
          fi

          uploaded=0
          failures=0

          for video in "${videos[@]}"; do
            echo ""
            echo "── Video: $video"
            meta="${video%/*}/youtube_meta.json"

            # Validate video file
            if [[ ! -s "$video" ]]; then
              echo "SKIP: video file is empty or missing: $video"
              failures=$((failures + 1))
              continue
            fi

            # Validate metadata file
            if [[ ! -f "$meta" ]]; then
              echo "SKIP: matching youtube_meta.json not found at $meta"
              failures=$((failures + 1))
              continue
            fi

            echo "   Metadata: $meta"
            if python3 youtube_upload.py "$video" "$meta"; then
              uploaded=$((uploaded + 1))
              echo "   ✓ Upload successful"
            else
              echo "   ✗ Upload failed for $video"
              failures=$((failures + 1))
            fi
          done

          echo ""
          echo "=== Upload Summary ==="
          echo "Uploaded: $uploaded"
          echo "Failed:   $failures"

          if [[ "$failures" -gt 0 ]]; then
            exit 1
          fi

      # ── 13. Final summary ─────────────────────────────────────────────────────
      - name: Print summary
        if: always()
        env:
          REQUESTED_COUNT: ${{ inputs.count }}
          MODEL:           ${{ inputs.model }}
          RANK_MODEL:      ${{ inputs.rank_model }}
          NO_VIDEO:        ${{ inputs.no_video }}
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║            Pipeline Run Summary                  ║"
          echo "╠══════════════════════════════════════════════════╣"
          echo "║  Run ID:           ${{ github.run_id }}"
          echo "║  Requested videos: $REQUESTED_COUNT"
          echo "║  Generation model: $MODEL"
          echo "║  Ranking model:    $RANK_MODEL"
          echo "║  Scripts-only:     $NO_VIDEO"
          echo "╚══════════════════════════════════════════════════╝"

          if [[ "$NO_VIDEO" != "true" ]]; then
            echo ""
            echo "=== Finished Videos ==="
            find output -type f -name 'draft_video.mp4' -exec ls -lh {} \; 2>/dev/null || echo "(none)"
          fi